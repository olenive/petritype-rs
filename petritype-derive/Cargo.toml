[package]
name = "petritype-derive"
version.workspace = true
description = "The derives of petritype: #[derive(Routed)] routes a returned value by type, #[derive(Inputs)] and #[derive(Outputs)] bind a body's inputs and outputs by field name."
readme = "../README.md"
keywords = ["petri-net", "derive", "macro"]
categories = ["development-tools::procedural-macro-helpers"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
