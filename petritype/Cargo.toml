[package]
name = "petritype"
version = "0.1.0"
description = "Typed, executable, observable Petri nets."
readme = "../README.md"
keywords = ["petri-net", "dataflow", "workflow", "simulation"]
categories = ["data-structures", "simulation"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
petritype-derive = { path = "../petritype-derive", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
trybuild = "1"
# No `version`: a path-only dev-dependency is stripped when the crate is
# packaged, which is what makes this dependency cycle legal. The examples are
# also the `petritype-dot` acceptance suite, so they draw the nets they run.
petritype-dot = { path = "../petritype-dot" }

[features]
serde = ["dep:serde", "dep:serde_json"]

# The first eight examples port the Python acceptance set (DESIGN §14). Each one is
# a program that runs its net and a test module that asserts what the Python
# example asserted, so `cargo test` covers them as well as `cargo run`.
[[example]]
name = "quickstart"
test = true

[[example]]
name = "parcel_distribution"
test = true

[[example]]
name = "caching"
test = true

[[example]]
name = "match_up_tokens"
test = true

[[example]]
name = "coloured_balls"
test = true

[[example]]
name = "web_scrape"
test = true

[[example]]
name = "execution_modes"
test = true

[[example]]
name = "read_edge_scaler"
test = true

# Nets as tokens (DESIGN §6.6): vehicles carrying nets of their own, a city
# that runs their journey under plain `step_deep`. The net itself is
# `examples/transit/net.rs`, the protocol's conformance net `transit`, which
# saves its vehicles' cabins as JSON: hence the feature.
[[example]]
name = "transit"
test = true
required-features = ["serde"]

# Token keys, filters and queries (DESIGN §8.3): species across habitats, and
# the proposal's five questions as tests. The net itself is
# `examples/wildlife/net.rs`, the protocol's conformance net `wildlife`, whose
# species are JSON and whose `season` is a wire parameter: hence the feature.
[[example]]
name = "wildlife"
test = true
required-features = ["serde"]

# Input edges that accept an empty place (DESIGN §4.4), the survey: a shop
# pricing orders with whatever promotions are running. The net itself is
# `examples/shop/net.rs`, the protocol's conformance net `shop`, every place
# of which a host may inject into: hence the feature.
[[example]]
name = "shop"
test = true
required-features = ["serde"]

# Input edges that accept an empty place (DESIGN §4.4), the drain: cars
# waiting at a light that cycles red, green and amber, all going when it
# turns green. The net itself is `examples/traffic_light/net.rs`, the
# protocol's conformance net `traffic-light`, every place of which a host may
# inject into: hence the feature.
[[example]]
name = "traffic_light"
test = true
required-features = ["serde"]

# Binding by name (DESIGN §4.4): a pricing library whose function takes a
# struct of inputs naming no place and no edge kind, wired into a shop by
# field name. The library is `examples/pricing/library.rs`, the net
# `examples/pricing/nets.rs`.
[[example]]
name = "pricing"
test = true

[package.metadata.docs.rs]
all-features = true
