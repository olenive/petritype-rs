[package]
name = "petritype-derive"
version = "0.1.0"
description = "The derives of petritype: #[derive(Routed)] routes a returned value by type, #[derive(Inputs)] and #[derive(Outputs)] bind a body's inputs and outputs by field name."
readme = "../README.md"
keywords = ["petri-net", "derive", "macro"]
categories = ["data-structures", "simulation"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
